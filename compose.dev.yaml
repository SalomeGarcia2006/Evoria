services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync
          path: ./packages/contracts/src
          target: /app/packages/contracts/src
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./packages/contracts/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  web:
    build:
      target: development
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./apps/web/app
          target: /app/apps/web/app
        - action: sync
          path: ./packages/contracts/src
          target: /app/packages/contracts/src
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./packages/contracts/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
