name: evoria

services:
  mongo:
    image: mongo:9.0.2-noble
    restart: unless-stopped
    entrypoint: ['/bin/bash', '/opt/evoria/mongo-entrypoint.sh']
    command:
      [
        'mongod',
        '--replSet',
        'evoria-rs',
        '--bind_ip_all',
        '--keyFile',
        '/data/replica-key/keyfile',
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-evoria}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-evoria_local_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-evoria}
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_replica_data:/data/db
      - mongo_replica_key:/data/replica-key
      - ./docker/mongo/entrypoint.sh:/opt/evoria/mongo-entrypoint.sh:ro
      - ./docker/mongo/healthcheck.js:/opt/evoria/mongo-healthcheck.js:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet "mongodb://127.0.0.1:27017/admin?directConnection=true" --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --file /opt/evoria/mongo-healthcheck.js',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3001'
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-evoria}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-evoria_local_password}
      MONGO_DATABASE: ${MONGO_DATABASE:-evoria}
      MONGO_HOST: mongo
      MONGO_DIRECT_CONNECTION: 'false'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/auth/google/callback}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - '3001:3001'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001/api
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_replica_data:
  mongo_replica_key:
