name: Validación

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  MONGO_ROOT_USERNAME: evoria_ci
  MONGO_ROOT_PASSWORD: evoria_ci_password
  MONGO_DATABASE: evoria_ci

jobs:
  up-to-date:
    name: Rama actualizada con main
    runs-on: ubuntu-latest

    steps:
      - name: Marcar PRs actualizados o pendientes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isPullRequest = context.eventName === 'pull_request';

            if (!isPullRequest && context.ref !== 'refs/heads/main') return;

            const baseSha = isPullRequest
              ? context.payload.pull_request.base.sha
              : context.sha;
            const pullRequests = isPullRequest
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: 'open',
                  base: 'main',
                  per_page: 100,
                });
            let currentPullRequestIsOutdated = false;

            for (const pullRequest of pullRequests) {
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: baseSha,
                head: pullRequest.head.sha,
              });
              const isUpToDate = comparison.data.behind_by === 0;

              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pullRequest.head.sha,
                state: isUpToDate ? 'success' : 'failure',
                context: 'Rama actualizada con main',
                description: isUpToDate
                  ? 'La rama contiene los cambios actuales de main.'
                  : 'Actualiza la rama con main antes de fusionarla.',
              });

              if (isPullRequest && !isUpToDate) {
                currentPullRequestIsOutdated = true;
              }
            }

            if (currentPullRequestIsOutdated) {
              core.setFailed('La rama no está actualizada con main.');
            }

  quality:
    name: Calidad y compilación
    needs: up-to-date
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run format:check

      - name: Ejecutar lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Compilar aplicaciones
        run: npm run build

  docker:
    name: Validación de Docker
    needs: quality
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar configuración de Compose
        run: docker compose config --quiet

      - name: Construir e iniciar servicios
        run: docker compose up --build --detach --wait

      - name: Comprobar API y web
        run: |
          curl --fail --retry 5 --retry-connrefused http://localhost:3001/api/health
          curl --fail --retry 5 --retry-connrefused http://localhost:3000

      - name: Crear colección temporal en MongoDB
        run: |
          docker compose exec -T mongo mongosh \
            --quiet \
            --username "$MONGO_ROOT_USERNAME" \
            --password "$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin \
            --eval "const database = db.getSiblingDB('$MONGO_DATABASE'); database.createCollection('pipeline_check'); if (!database.getCollectionNames().includes('pipeline_check')) quit(1);"

      - name: Mostrar logs ante un fallo
        if: failure()
        run: docker compose logs --no-color

      - name: Detener y limpiar servicios
        if: always()
        run: docker compose down --volumes --remove-orphans
